name: Publish iPhone app

on:
  push:
    branches: [main]
    paths:
      - 'iphone/**'
      - '.github/workflows/iphone-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: iphone-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload iPhone app only
        uses: actions/upload-pages-artifact@v3
        with:
          path: iphone
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
